name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pinned Python installer
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Create environment with pinned Python
        run: |
          uv venv --python "$(cat .python-version)" --managed-python .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install package and dev checks
        run: |
          uv pip install --python .venv/bin/python --require-hashes --only-binary=:all: --reinstall -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Type check
        run: |
          mypy src
          mypy scripts/verify_toolchain_replay.py
      - name: Build and install distribution
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import quant_test.data; import quant_test.core.time"
      - name: Verify hash rejection for an installed package
        run: python scripts/verify_hash_install.py dist/*.whl
      - name: Unit tests
        run: pytest -q
      - name: Materialize locked wheels and replay toolchain offline
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys

          root = pathlib.Path.cwd().resolve()
          spec = importlib.util.spec_from_file_location(
              "ci_toolchain_replay", root / "scripts" / "verify_toolchain_replay.py"
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          work = root / "dist" / "toolchain-replay"
          work.mkdir()
          reports = work / "reports"
          reports.mkdir()
          wheels = work / "wheels"
          module.download_locked_wheels(root / "requirements-dev.lock", wheels)
          local = list((root / "dist").glob("quant_test-*.whl"))
          if len(local) != 1:
              raise RuntimeError("Expected exactly one built local wheel")
          inputs = module.ReplayInputs(
              wheels, local[0], root / "requirements-dev.lock", root, reports
          )
          manifest = module.capture(
              inputs,
              module.digest(module.read_regular(inputs.lock)),
              module.digest(module.read_regular(inputs.local_wheel)),
          )
          print("INPUT_MANIFEST_SHA256", manifest, flush=True)
          print(module.read_regular(reports / manifest).decode("ascii"), flush=True)
          report = module.replay(inputs, manifest)
          print("REPLAY_REPORT_SHA256", report, flush=True)
          print(module.read_regular(reports / report).decode("ascii"), flush=True)
          PY
